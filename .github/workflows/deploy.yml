name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v5
      # The booking endpoint is a serverless route and cannot exist in a static
      # export, so it is removed for the Pages build only. Pages is the client's
      # preview link and has to keep deploying until the real domain is live;
      # on Vercel the route is present and the form posts to it, while the Pages
      # build falls back to the mailto compose. Deleting it here rather than
      # letting the build fail is what keeps the two targets honest.
      - name: Drop the serverless route (static export cannot host it)
        run: rm -rf src/app/api
      - run: pnpm build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
